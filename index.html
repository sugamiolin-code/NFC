<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARテスト</title>

<script
type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
background-color: #dddddd;
}

model-viewer {
width: 100vw;
height: 100vh;
}

#ar-button {
position: absolute;
bottom: 40px;
left: 50%;
transform: translateX(-50%);
z-index: 999;

padding: 16px 30px;

border: none;
border-radius: 30px;

background: black;
color: white;

font-size: 18px;
font-weight: bold;
}
</style>

</head>

<body>

<model-viewer
src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"

camera-controls

ar
ar-modes="quick-look"

environment-image="neutral"
shadow-intensity="1">

<button
id="ar-button"
slot="ar-button">

ARで見る

</button>

</model-viewer>

</body>

</html>
