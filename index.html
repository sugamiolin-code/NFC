<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>3Dモデル</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #f5f5f5;
}

model-viewer {
width: 100%;
height: 100%;
}
</style>
</head>

<body>

<model-viewer
src="NFC.glb"
camera-controls
touch-action="pan-y"
auto-rotate
shadow-intensity="1"
alt="3Dモデル">
</model-viewer>

</body>

</html>
