<!DOCTYPE html>
<html lang="ja">

<head>
 <meta charset="UTF-8">

 <meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

 <title>3Dモデル</title>

 <script
 type="module"
 src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
 </script>

 <style>

 html, body {
 margin: 0;
 width: 100%;
 height: 100%;
 background-color: #dddddd;
 }

 model-viewer {
 width: 100vw;
 height: 100vh;
 }

 </style>

</head>


<body>


 <model-viewer

 src="./NFC.glb"

 camera-controls

 auto-rotate

 environment-image="neutral"

 shadow-intensity="1"

 ar

 ar-modes="webxr scene-viewer quick-look"

 ar-scale="fixed">


 <button
 slot="ar-button"
 style="
 position: absolute;
 bottom: 30px;
 left: 50%;
 transform: translateX(-50%);
 padding: 14px 24px;
 font-size: 18px;
 border: none;
 border-radius: 30px;
 background: black;
 color: white;
 ">

 ARで見る

 </button>


 </model-viewer>


</body>

</html>
