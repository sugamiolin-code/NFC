<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NFC ARモデル</title>

<script
type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>

<style>

html, body {
margin: 0;
width: 100%;
height: 100%;
background-color: #dddddd;
font-family: sans-serif;
}

model-viewer {
width: 100vw;
height: 100vh;
}

/* 縮尺選択 */
#controls {
position: absolute;
top: 20px;
left: 20px;
z-index: 999;

background: white;
padding: 14px;

border-radius: 12px;

box-shadow: 0 3px 12px rgba(0,0,0,0.2);
}

#controls label {
font-size: 15px;
font-weight: bold;
}

#scale-select {
margin-top: 8px;

width: 130px;

padding: 8px;

font-size: 16px;

border-radius: 8px;
border: 1px solid #aaa;
}

#scale-info {
margin-top: 8px;
font-size: 14px;
}

/* ARボタン */
#ar-button {
position: absolute;

bottom: 40px;
left: 50%;

transform: translateX(-50%);

padding: 16px 30px;

border: none;
border-radius: 30px;

background: black;
color: white;

font-size: 18px;
font-weight: bold;

z-index: 999;
}

</style>
</head>


<body>


<div id="controls">

<label for="scale-select">
AR表示サイズ
</label>

<br>

<select id="scale-select">

<option value="1">
実寸 1:1
</option>

<option value="0.1">
1:10
</option>

<option value="0.02">
1:50
</option>

<option value="0.01">
1:100
</option>

</select>

<div id="scale-info">
実寸表示
</div>

</div>


<model-viewer

id="viewer"

src="./NFC.glb"

camera-controls

ar

ar-modes="quick-look"

ar-scale="fixed"

environment-image="neutral"

scale="1 1 1">

<button
id="ar-button"
slot="ar-button">

ARで見る

</button>

</model-viewer>


<script>

const viewer =
document.getElementById("viewer");

const scaleSelect =
document.getElementById("scale-select");

const scaleInfo =
document.getElementById("scale-info");


scaleSelect.addEventListener("change", () => {

const scale =
Number(scaleSelect.value);

viewer.scale =
`${scale} ${scale} ${scale}`;

viewer.updateFraming();


if (scale === 1) {

scaleInfo.textContent =
"実寸表示";

}

else if (scale === 0.1) {

scaleInfo.textContent =
"実物の1/10";

}

else if (scale === 0.02) {

scaleInfo.textContent =
"実物の1/50";

}

else if (scale === 0.01) {

scaleInfo.textContent =
"実物の1/100";

}

});

</script>


</body>

</html>
