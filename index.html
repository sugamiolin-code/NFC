<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARテスト</title>

<script
type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
}

model-viewer {
width: 100%;
height: 100%;
background: #dddddd;
}

#test {
position: absolute;
top: 20px;
left: 20px;
z-index: 999;
background: white;
padding: 10px;
border-radius: 8px;
}

#ar-button {
position: absolute;
bottom: 40px;
left: 50%;
transform: translateX(-50%);
z-index: 999;

padding: 16px 30px;

border: none;
border-radius: 30px;

background: black;
color: white;

font-size: 18px;
font-weight: bold;
}
</style>
</head>

<body>

<div id="test">
ARチェック中...
</div>

<model-viewer
id="viewer"

src="./NFC.glb"

camera-controls

ar
ar-modes="quick-look webxr scene-viewer"

environment-image="neutral">

<button
id="ar-button"
slot="ar-button">

ARで見る

</button>

</model-viewer>


<script>

const viewer = document.getElementById("viewer");
const test = document.getElementById("test");

viewer.addEventListener("load", () => {

test.innerHTML =
"3Dモデル：読み込み成功<br>" +
"AR対応：" + viewer.canActivateAR;

});

viewer.addEventListener("error", (event) => {

test.innerHTML =
"3Dモデル：読み込みエラー";

console.log(event);

});

</script>

</body>

</html>
